appId: ch.trentini.gluehwuermli
productName: Glühwürmli
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# serialport ships N-API prebuilds that load in Electron as they are; a rebuild would need Visual Studio
npmRebuild: false
# native modules can't be loaded from inside the asar archive
asarUnpack:
  - '**/node_modules/@serialport/bindings-cpp/**'
win:
  target: nsis
  icon: src/resources/favicon/android-chrome-512x512.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
