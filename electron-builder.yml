appId: ch.xeronimus.gluehwuermli
productName: Glühwürmli
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# serialport ships N-API prebuilds that load in Electron as they are; a rebuild would need Visual Studio
npmRebuild: false
# native modules can't be loaded from inside the asar archive
asarUnpack:
  - '**/node_modules/@serialport/bindings-cpp/**'
win:
  target: nsis
  icon: src/assets/favicon/android-chrome-512x512.png
mac:
  # one dmg for Apple Silicon and Intel: nobody has to know their chip
  target:
    - target: dmg
      arch: universal
  icon: src/assets/favicon/android-chrome-512x512.png
  category: public.app-category.music
  # ad-hoc signed, no Developer ID (so no notarization and no auto-update, src/main/config.ts): Apple Silicon starts
  # no unsigned binary at all, and electron-builder changes the bundle after Electron signed it
  identity: '-'
  # only needed for notarization; with ad-hoc signing its library validation would refuse the serialport .node
  hardenedRuntime: false
  # serialport's macOS prebuild is a universal binary already, the same file in both builds: @electron/universal
  # refuses to merge an identical Mach-O file unless it is named here
  x64ArchFiles: '**/node_modules/@serialport/bindings-cpp/prebuilds/darwin-x64+arm64/*.node'
dmg:
  # ASCII only: GitHub renames release assets with an "ü"
  artifactName: gluehwuermli-${version}-mac.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # ASCII only: GitHub renames release assets with an "ü", which would no longer match the name in latest.yml
  artifactName: gluehwuermli-setup-${version}.${ext}
  # the installer is signed after it is built (.github/workflows/release.yml), which would make a blockmap wrong; an
  # update downloads the whole installer instead of the changed blocks
  differentialPackage: false
# where an installed app looks for updates (electron-updater, src/main/update/), packaged as resources/app-update.yml.
# electron-builder never publishes itself: the release workflow attaches the signed installer and latest.yml
publish:
  provider: github
  owner: xeronimus
  repo: gluehwuermli
# a double-click on a .glp starts the app with that project, or hands it to the running one (src/main/index.ts):
# Windows passes the file as an argument or to second-instance, macOS sends open-file
fileAssociations:
  - ext: glp
    name: Glühwürmli project
    description: Glühwürmli project
    # relative to buildResources (build/): the app icon on a page. On macOS electron-builder takes project.icns in its
    # place, made once from the PNG frames of project.ico (each frame stored as it is, an icns entry takes a PNG)
    icon: project.ico
    role: Editor
