name: Mac build check

# TEMPORARY (#11), deleted before the branch is merged: builds the macOS dmg the way release.yml does, on a push to
# this branch, and keeps it as a workflow artifact for the checks by hand on a Mac. Not workflow_dispatch (GitHub only
# dispatches workflows on the default branch) and not pull_request (electron-builder doesn't sign in a PR build, an
# unsigned app doesn't start on Apple Silicon).
on:
  push:
    branches: [ '11-macos-build' ]

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Version
      run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

    - name: Test
      run: pnpm test

    - name: Build the dmg
      run: pnpm dist:mac --publish never

    - name: Keep the dmg
      uses: actions/upload-artifact@v7
      with:
        name: gluehwuermli-mac-dmg
        path: dist/gluehwuermli-${{ env.VERSION }}-mac.dmg
        if-no-files-found: error
